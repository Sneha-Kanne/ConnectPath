<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Route Line Gradient -->
    <linearGradient id="routeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Radar Waves Gradient -->
    <radialGradient id="waveGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="6" />

  <!-- Radio Tower / Signal Waves (Top Right) -->
  <g transform="translate(160, 40)" opacity="0.9">
    <!-- Wave 1 (Inner) -->
    <path d="M 60 120 A 40 40 0 0 1 140 120" fill="none" stroke="#00f0ff" stroke-width="10" stroke-linecap="round" filter="url(#glowCyan)" />
    <!-- Wave 2 (Middle) -->
    <path d="M 30 120 A 70 70 0 0 1 170 120" fill="none" stroke="#00f0ff" stroke-width="12" stroke-linecap="round" opacity="0.75" />
    <!-- Wave 3 (Outer) -->
    <path d="M 0 120 A 100 100 0 0 1 200 120" fill="none" stroke="#00f0ff" stroke-width="14" stroke-linecap="round" opacity="0.45" />
    <!-- Center Tower Beacon -->
    <circle cx="100" cy="120" r="14" fill="#00f0ff" filter="url(#glowCyan)" />
    <circle cx="100" cy="120" r="7" fill="#ffffff" />
  </g>

  <!-- Navigational Curved Path Geometry -->
  <g filter="url(#glowCyan)">
    <!-- Main Route Spine -->
    <path d="M 110 390 C 130 260, 230 330, 270 240 S 370 200, 400 110" 
          fill="none" 
          stroke="url(#routeGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Dotted Flow Waypoints -->
    <path d="M 110 390 C 130 260, 230 330, 270 240 S 370 200, 400 110" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="8" 
          stroke-dasharray="16 22" 
          stroke-linecap="round" 
          opacity="0.9" />
  </g>

  <!-- Start Point (Origin - Coral Glow) -->
  <circle cx="110" cy="390" r="26" fill="#ff3366" filter="url(#glowCyan)" />
  <circle cx="110" cy="390" r="14" fill="#ffffff" />

  <!-- Mid Waypoint (Grid Node - Cyan Glow) -->
  <circle cx="270" cy="240" r="18" fill="#00f0ff" />
  <circle cx="270" cy="240" r="9" fill="#0b1120" />

  <!-- Destination Point (Safe Zone - Emerald Glow) -->
  <circle cx="400" cy="110" r="24" fill="#10b981" filter="url(#glowCyan)" />
  <circle cx="400" cy="110" r="12" fill="#ffffff" />
</svg>
